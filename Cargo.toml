[package]
name = "dumper"
version = "0.1.0"
authors = ["Dumper Maintainers"]
categories = ["command-line-utilities", "database"]
edition = "2021"
keywords = ["backup", "database", "postgres", "mysql", "s3"]
license = "MIT OR Apache-2.0"
readme = "README.md"
description = "A tiny, production-grade database backup, restore, verification, retention, and repository-management CLI"

[dependencies]
# Async Runtime (lightweight single-threaded or current-thread)
bytes = { version = "1.9", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }
tokio = { version = "1.43", default-features = false, features = ["rt", "macros", "time", "sync", "io-util", "net", "fs", "signal"] }
libc = { version = "0.2", default-features = false }

# CLI Parsing
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
rpassword = { version = "7.3", default-features = false }

# Cryptography
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
crc32fast = { version = "1.4", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
sha2 = { version = "0.10", default-features = false }

# Compression
zstd = { version = "0.13", default-features = false }

# Serialization & Datetimes
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc", "std"] }

# HTTP & URLs (for S3 API)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
url = { version = "2.5", default-features = false }

# Database Wire Protocols
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["webpki-roots", "ring"] }
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
