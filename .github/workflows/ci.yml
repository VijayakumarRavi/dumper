name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - master
      - "renovate/**"
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 0 * * 0"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run Cargo Fmt
        run: cargo fmt --all -- --check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for typos
        uses: crate-ci/typos@v1.38.1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        job:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install test services (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql mariadb-server curl openssl
          # Add postgres utilities to PATH
          echo "/usr/lib/postgresql/16/bin" >> $GITHUB_PATH
          sudo curl -sSL https://garagehq.deuxfleurs.fr/_releases/v1.3.1/x86_64-unknown-linux-musl/garage -o /usr/local/bin/garage
          sudo chmod +x /usr/local/bin/garage

      - name: Run Cargo Test
        run: cargo test -r --all-targets --workspace

  real-e2e:
    name: Real Services E2E (Deep Schema & Data Comparison)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: postgres
          POSTGRES_DB: e2e_pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: e2e_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: e2e_mariadb
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Database Client Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client mysql-client curl

      - name: Start Garage S3 Server
        run: |
          sudo curl -sSL https://garagehq.deuxfleurs.fr/_releases/v1.3.1/x86_64-unknown-linux-musl/garage -o /usr/local/bin/garage
          sudo chmod +x /usr/local/bin/garage
          mkdir -p /tmp/garage/meta /tmp/garage/data
          cat <<EOF > /tmp/garage/garage.toml
          metadata_dir = "/tmp/garage/meta"
          data_dir = "/tmp/garage/data"
          db_engine = "sqlite"
          replication_factor = 1

          rpc_bind_addr = "127.0.0.1:3901"
          rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

          [s3_api]
          s3_region = "us-east-1"
          api_bind_addr = "127.0.0.1:3900"
          root_domain = ".s3.garage"
          EOF
          garage -c /tmp/garage/garage.toml server > /tmp/garage/garage.log 2>&1 &
          for i in {1..30}; do
            if garage -c /tmp/garage/garage.toml status >/dev/null 2>&1; then
              echo "Garage is ready"
              break
            fi
            sleep 0.2
          done
          NODE_ID=$(garage -c /tmp/garage/garage.toml node id 2>/dev/null | head -n 1)
          garage -c /tmp/garage/garage.toml layout assign -z dc1 -c 1G "$NODE_ID"
          garage -c /tmp/garage/garage.toml layout apply --version 1
          garage -c /tmp/garage/garage.toml key import --yes GK0123456789abcdef01234567 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          garage -c /tmp/garage/garage.toml bucket create test-bucket
          garage -c /tmp/garage/garage.toml bucket allow --read --write --owner test-bucket --key GK0123456789abcdef01234567

      - name: Build Dumper Release Binary
        run: cargo build --release

      - name: PostgreSQL E2E (Local Repo) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./scripts/ci/test-e2e-postgres.sh \
            "postgres://postgres:testpassword@127.0.0.1:5432/e2e_pg" \
            "/tmp/dumper-local-pg-repo" \
            "./target/release/dumper"

      - name: PostgreSQL E2E (Garage S3) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="s3-repo-password"
          export DUMPER_S3_ENDPOINT="http://127.0.0.1:3900"
          export DUMPER_S3_ACCESS_KEY_ID="GK0123456789abcdef01234567"
          export DUMPER_S3_SECRET_ACCESS_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          export DUMPER_REPOSITORY="s3://test-bucket/backups/pg"
          ./target/release/dumper init
          ./scripts/ci/test-e2e-postgres.sh \
            "postgres://postgres:testpassword@127.0.0.1:5432/e2e_pg" \
            "s3://test-bucket/backups/pg" \
            "./target/release/dumper"

      - name: MySQL 8.0 E2E (Local Repo) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3306/e2e_mysql" \
            "/tmp/dumper-local-mysql-repo" \
            "mysql" \
            "./target/release/dumper"

      - name: MySQL 8.0 E2E (Garage S3) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="s3-repo-password"
          export DUMPER_S3_ENDPOINT="http://127.0.0.1:3900"
          export DUMPER_S3_ACCESS_KEY_ID="GK0123456789abcdef01234567"
          export DUMPER_S3_SECRET_ACCESS_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          export DUMPER_REPOSITORY="s3://test-bucket/backups/mysql"
          ./target/release/dumper init
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3306/e2e_mysql" \
            "s3://test-bucket/backups/mysql" \
            "mysql" \
            "./target/release/dumper"

      - name: MariaDB 11.4 E2E (Local Repo) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3307/e2e_mariadb" \
            "/tmp/dumper-local-mariadb-repo" \
            "mysql" \
            "./target/release/dumper"

      - name: MariaDB 11.4 E2E (Garage S3) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="s3-repo-password"
          export DUMPER_S3_ENDPOINT="http://127.0.0.1:3900"
          export DUMPER_S3_ACCESS_KEY_ID="GK0123456789abcdef01234567"
          export DUMPER_S3_SECRET_ACCESS_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          export DUMPER_REPOSITORY="s3://test-bucket/backups/mariadb"
          ./target/release/dumper init
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3307/e2e_mariadb" \
            "s3://test-bucket/backups/mariadb" \
            "mysql" \
            "./target/release/dumper"

      - name: Repository Lifecycle & Pruning Verification
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" snapshots
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" stats
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" forget --keep-last 1 --prune
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" check

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Cargo Doc
        run: cargo doc --no-deps --all-features --workspace

  result:
    name: Result (CI)
    runs-on: ubuntu-latest
    needs:
      - fmt
      - typos
      - clippy
      - test
      - real-e2e
      - docs
    steps:
      - name: Mark the job as successful
        run: exit 0
        if: success()
      - name: Mark the job as unsuccessful
        run: exit 1
        if: "!success()"
