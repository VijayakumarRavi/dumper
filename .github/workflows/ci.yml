name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - master
      - "renovate/**"
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 0 * * 0"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run Cargo Fmt
        run: cargo fmt --all -- --check

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for typos
        uses: crate-ci/typos@v1.38.1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        job:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install test services (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql mariadb-server curl openssl
          # Download MinIO binary for local service test discovery
          curl -sSL -o /tmp/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /tmp/minio
          sudo mv /tmp/minio /usr/local/bin/minio
          # Add postgres utilities to PATH
          echo "/usr/lib/postgresql/16/bin" >> $GITHUB_PATH

      - name: Run Cargo Test
        run: cargo test -r --all-targets --workspace

  real-e2e:
    name: Real Services E2E (Deep Schema & Data Comparison)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: postgres
          POSTGRES_DB: e2e_pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: e2e_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: e2e_mariadb
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Database Client Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client mysql-client curl

      - name: Start MinIO Server
        run: |
          mkdir -p /tmp/minio_data/test-bucket
          docker run -d --name minio -p 9000:9000 \
            -v /tmp/minio_data:/data \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            sleep 1
          done

      - name: Build Dumper Release Binary
        run: cargo build --release

      - name: PostgreSQL E2E (Local Repo) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./scripts/ci/test-e2e-postgres.sh \
            "postgres://postgres:testpassword@127.0.0.1:5432/e2e_pg" \
            "/tmp/dumper-local-pg-repo" \
            "./target/release/dumper"

      - name: PostgreSQL E2E (MinIO S3) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="s3-repo-password"
          export DUMPER_S3_ENDPOINT="http://127.0.0.1:9000"
          export DUMPER_S3_ACCESS_KEY_ID="minioadmin"
          export DUMPER_S3_SECRET_ACCESS_KEY="minioadmin"
          export DUMPER_REPOSITORY="s3://test-bucket/backups/pg"
          ./target/release/dumper init
          ./scripts/ci/test-e2e-postgres.sh \
            "postgres://postgres:testpassword@127.0.0.1:5432/e2e_pg" \
            "s3://test-bucket/backups/pg" \
            "./target/release/dumper"

      - name: MySQL 8.0 E2E (Local Repo) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3306/e2e_mysql" \
            "/tmp/dumper-local-mysql-repo" \
            "mysql" \
            "./target/release/dumper"

      - name: MySQL 8.0 E2E (MinIO S3) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="s3-repo-password"
          export DUMPER_S3_ENDPOINT="http://127.0.0.1:9000"
          export DUMPER_S3_ACCESS_KEY_ID="minioadmin"
          export DUMPER_S3_SECRET_ACCESS_KEY="minioadmin"
          export DUMPER_REPOSITORY="s3://test-bucket/backups/mysql"
          ./target/release/dumper init
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3306/e2e_mysql" \
            "s3://test-bucket/backups/mysql" \
            "mysql" \
            "./target/release/dumper"

      - name: MariaDB 11.4 E2E (Local Repo) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3307/e2e_mariadb" \
            "/tmp/dumper-local-mariadb-repo" \
            "mysql" \
            "./target/release/dumper"

      - name: MariaDB 11.4 E2E (MinIO S3) - Deep Data & Schema Compare
        run: |
          export DUMPER_PASSWORD="s3-repo-password"
          export DUMPER_S3_ENDPOINT="http://127.0.0.1:9000"
          export DUMPER_S3_ACCESS_KEY_ID="minioadmin"
          export DUMPER_S3_SECRET_ACCESS_KEY="minioadmin"
          export DUMPER_REPOSITORY="s3://test-bucket/backups/mariadb"
          ./target/release/dumper init
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3307/e2e_mariadb" \
            "s3://test-bucket/backups/mariadb" \
            "mysql" \
            "./target/release/dumper"

      - name: Repository Lifecycle & Pruning Verification
        run: |
          export DUMPER_PASSWORD="local-repo-password"
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" snapshots
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" stats
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" forget --keep-last 1 --prune
          ./target/release/dumper -r "/tmp/dumper-local-pg-repo" check

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Cargo Doc
        run: cargo doc --no-deps --all-features --workspace

  result:
    name: Result (CI)
    runs-on: ubuntu-latest
    needs:
      - fmt
      - typos
      - clippy
      - test
      - real-e2e
      - docs
    steps:
      - name: Mark the job as successful
        run: exit 0
        if: success()
      - name: Mark the job as unsuccessful
        run: exit 1
        if: "!success()"
