name: Continuous Deployment (Release)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

defaults:
  run:
    shell: bash

permissions:
  contents: write

env:
  BINARY_NAME: dumper

jobs:
  build-release:
    name: Build ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
        job:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary-postfix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary-postfix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary-postfix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary-postfix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            binary-postfix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary-postfix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary-postfix: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job.target }}

      - name: Install cross toolchain if needed
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.job.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.job.target }}

      - name: Package release artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG=${GITHUB_REF_NAME:-v0.1.0}
          ARCHIVE="${{ env.BINARY_NAME }}-${TAG}-${{ matrix.job.target }}.tar.gz"
          cd "target/${{ matrix.job.target }}/release"
          tar -czf "../../../${ARCHIVE}" "${{ env.BINARY_NAME }}"
          cd "../../.."
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Package release artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          $TAG = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $ARCHIVE = "${{ env.BINARY_NAME }}-${TAG}-${{ matrix.job.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.job.target }}/release/${{ env.BINARY_NAME }}.exe" -DestinationPath $ARCHIVE
          $HASH = (Get-FileHash -Path $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$HASH  $ARCHIVE" | Out-File -FilePath "$ARCHIVE.sha256" -Encoding ascii
          echo "ARCHIVE=$ARCHIVE" >> $env:GITHUB_ENV

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.job.target }}
          path: |
            ${{ env.BINARY_NAME }}-*

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p release-dist
          find artifacts/ -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release-dist/ \;
          ls -la release-dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
