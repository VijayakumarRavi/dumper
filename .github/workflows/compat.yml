name: Database Compatibility Matrix

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - master
      - "renovate/**"
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 2 * * 0" # Weekly on Sunday at 02:00
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  postgres-compat:
    name: Postgres ${{ matrix.pg_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [14, 15, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pg_version }}
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: postgres
          POSTGRES_DB: compat_pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Build Dumper
        run: cargo build --release

      - name: Test Postgres ${{ matrix.pg_version }} (Deep Data & Schema Compare)
        run: |
          ./scripts/ci/test-e2e-postgres.sh \
            "postgres://postgres:testpassword@127.0.0.1:5432/compat_pg" \
            "/tmp/dumper-pg-${{ matrix.pg_version }}" \
            "./target/release/dumper"

  mysql-compat:
    name: MySQL ${{ matrix.mysql_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql_version: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql_version }}
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: compat_mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ptestpassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Build Dumper
        run: cargo build --release

      - name: Test MySQL ${{ matrix.mysql_version }} (Deep Data & Schema Compare)
        run: |
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3306/compat_mysql" \
            "/tmp/dumper-mysql-${{ matrix.mysql_version }}" \
            "mysql" \
            "./target/release/dumper"

  mariadb-compat:
    name: MariaDB ${{ matrix.mariadb_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb_version: ["10.11", "11.4"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb_version }}
        env:
          MARIADB_ROOT_PASSWORD: testpassword
          MARIADB_DATABASE: compat_mariadb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Build Dumper
        run: cargo build --release

      - name: Test MariaDB ${{ matrix.mariadb_version }} (Deep Data & Schema Compare)
        run: |
          ./scripts/ci/test-e2e-mysql.sh \
            "mysql://root:testpassword@127.0.0.1:3306/compat_mariadb" \
            "/tmp/dumper-mariadb-${{ matrix.mariadb_version }}" \
            "mariadb" \
            "./target/release/dumper"

  result:
    name: Result (Compatibility)
    runs-on: ubuntu-latest
    needs:
      - postgres-compat
      - mysql-compat
      - mariadb-compat
    steps:
      - name: Mark the job as successful
        run: exit 0
        if: success()
      - name: Mark the job as unsuccessful
        run: exit 1
        if: "!success()"
